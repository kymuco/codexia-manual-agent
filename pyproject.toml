[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codexia-manual-agent"
version = "0.5.0a0"
description = "Human-governed coding agent and local computational laboratory"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-PolyForm-Perimeter-1.0.1"
license-files = ["LICENSE", "LICENSING.md"]
authors = [{ name = "kymuco" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/kymuco/codexia-manual-agent"
Repository = "https://github.com/kymuco/codexia-manual-agent"
Issues = "https://github.com/kymuco/codexia-manual-agent/issues"
Documentation = "https://github.com/kymuco/codexia-manual-agent/tree/main/docs"

[project.optional-dependencies]
web = ["chatgpt-web-adapter==0.1.5"]
test = ["pytest>=8"]

[project.scripts]
codexia = "codexia_manual_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codexia_manual_agent = ["prompt_assets/*.txt"]
