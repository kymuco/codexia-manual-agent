name: CI

on:
  push:
    branches: ["main", "m*/**", "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure canonical Windows temp root
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $canonical = python -c "import os; print(os.path.realpath(os.environ['RUNNER_TEMP']))"
          "TEMP=$canonical" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$canonical" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify canonical Windows temp root
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          python -c "import os,tempfile; from pathlib import Path; p=Path(tempfile.gettempdir()); r=p.resolve(strict=True); assert os.path.normcase(os.path.abspath(str(p))) == os.path.normcase(os.path.abspath(str(r))), (p, r)"
      - name: Install Linux process containment dependency
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor-profiles apparmor-utils
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          test -f "$profile"
          sudo install -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
      - name: Verify Linux PID containment primitive
        if: runner.os == 'Linux'
        shell: bash
        run: >-
          /usr/bin/bwrap
          --unshare-pid
          --die-with-parent
          --bind / /
          --proc /proc
          -- /bin/true
      - name: Install core and test tooling
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q
      - name: CLI smoke
        run: python -m codexia_manual_agent --version

  web-provider-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Configure canonical Windows temp root
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $canonical = python -c "import os; print(os.path.realpath(os.environ['RUNNER_TEMP']))"
          "TEMP=$canonical" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$canonical" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify canonical Windows temp root
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          python -c "import os,tempfile; from pathlib import Path; p=Path(tempfile.gettempdir()); r=p.resolve(strict=True); assert os.path.normcase(os.path.abspath(str(p))) == os.path.normcase(os.path.abspath(str(r))), (p, r)"
      - name: Install web provider and test tooling
        run: python -m pip install -e ".[web,test]"
      - name: Verify adapter stable-core contract
        run: python -m pytest -q tests/test_web_adapter_contract.py
